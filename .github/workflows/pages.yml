name: Publicar prévia da Lumi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v6

      - name: Verificar a lógica
        run: node --test scripts/*.test.mjs

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar a prévia
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
